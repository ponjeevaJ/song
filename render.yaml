databases:
  - name: isai-world-db
    databaseName: isaiworld
    user: isaiworld
    plan: basic-1gb
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: isai-world-api
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/catalog/status
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: isai-world-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: isai-world-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: isai-world-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: isai-world-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: isai-world-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CATALOG_API_URL
        sync: false
      - key: CATALOG_API_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CATALOG_SYNC_CRON
        value: "0 0 2 * * *"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173

  - type: web
    name: isai-world
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 80
      - key: BACKEND_URL
        value: http://isai-world-api:8080
      - key: NGINX_ENVSUBST_FILTER
        value: "^(BACKEND_URL|PORT)$"
