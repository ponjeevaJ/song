services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isaiworld}
      POSTGRES_USER: ${POSTGRES_USER:-isaiworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - isaiworld-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isaiworld} -d ${POSTGRES_DB:-isaiworld}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-isaiworld}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-isaiworld}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CATALOG_API_URL: ${CATALOG_API_URL:-}
      CATALOG_API_TOKEN: ${CATALOG_API_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CATALOG_SYNC_CRON: ${CATALOG_SYNC_CRON:-0 0 2 * * *}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://backend:8080
      PORT: 80
      NGINX_ENVSUBST_FILTER: "^(BACKEND_URL|PORT)$"
    depends_on:
      - backend
volumes:
  isaiworld-data:
