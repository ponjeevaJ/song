spring.application.name=isai-world-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:isaiworld}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:isaiworld}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
isai.jwt.secret=${JWT_SECRET:}
isai.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
isai.admin.email=${ADMIN_EMAIL:}
isai.admin.password=${ADMIN_PASSWORD:}
isai.catalog.url=${CATALOG_API_URL:}
isai.catalog.token=${CATALOG_API_TOKEN:}
isai.youtube.api-key=${YOUTUBE_API_KEY:}
isai.catalog.sync-cron=${CATALOG_SYNC_CRON:0 0 2 * * *}
isai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
